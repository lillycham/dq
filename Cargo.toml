[package]
name = "dq"
version = "0.1.0"
edition = "2024"
description = "Query and manipulate directory trees with jq expressions"
license = "GPL-3.0-or-later"
repository = "https://github.com/lillycham/dq"
readme = "README.md"
keywords = ["jq", "filesystem", "query", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
jaq-core = "3.1"
jaq-std = "3.0"
jaq-json = "2.0"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
